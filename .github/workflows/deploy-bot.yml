# ============================================================================
# AVTOMAKTAB BOT — alohida EC2 (#2) ga joylashtirish
#
# Veb-saytdan MUSTAQIL: faqat bot/ va docker-compose.bot.yml o'zgarganda ishlaydi.
# Bot polling rejimida — 80/443 ochish shart emas (faqat SSH:22).
#
# GitHub Secrets:
#   BOT_HOST           — bot EC2 public IP/DNS
#   BOT_USER           — SSH user (ubuntu / ec2-user)
#   BOT_SSH_KEY        — private SSH kalit
#   BOT_APP_DIR        — serverdagi papka (masalan /opt/autoprime-bot)
#   BOT_TOKEN          — @BotFather tokeni
#   ADMIN_IDS          — admin Telegram ID'lari
#   BOT_PLATFORM_URL   — veb-sayt manzili (keyin domen berilganda yangilanadi)
#   (ixtiyoriy) BOT_PORT, BOT_ADMINS, BOT_DEFAULT_LANG
# ============================================================================
name: AvtoMaktab Bot — Deploy (EC2)

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "docker-compose.bot.yml"
      - "scripts/aws_bootstrap.sh"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bot sintaksisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q bot
      - name: Workflow tekshiruvi
        run: python tools_workflow_check.py

  deploy:
    name: Botni alohida EC2 ga joylashtirish
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: BOT secret'lari bormi?
        id: gate
        env:
          BOT_HOST: ${{ secrets.BOT_HOST }}
          BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
        run: |
          if [ -n "${BOT_HOST}" ] && [ -n "${BOT_SSH_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bot deploy o'tkazildi::BOT_HOST/BOT_SSH_KEY secret'lari qo'yilmagan."
          fi

      - name: SSH orqali botni joylashtirish
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          BOT_ADMINS: ${{ secrets.BOT_ADMINS }}
          BOT_DEFAULT_LANG: ${{ secrets.BOT_DEFAULT_LANG }}
          BOT_PLATFORM_URL: ${{ secrets.BOT_PLATFORM_URL || vars.WEB_URL }}
        with:
          host: ${{ secrets.BOT_HOST }}
          username: ${{ secrets.BOT_USER }}
          key: ${{ secrets.BOT_SSH_KEY }}
          port: ${{ secrets.BOT_PORT || '22' }}
          envs: BOT_TOKEN,ADMIN_IDS,BOT_ADMINS,BOT_DEFAULT_LANG,BOT_PLATFORM_URL
          script: |
            set -e
            APP_DIR="${{ secrets.BOT_APP_DIR }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            bash scripts/aws_bootstrap.sh bot
            cat > .env <<EOF
            BOT_TOKEN=${BOT_TOKEN}
            ADMIN_IDS=${ADMIN_IDS}
            BOT_ADMINS=${BOT_ADMINS}
            PLATFORM_NAME=AutoPrime
            PLATFORM_URL=${BOT_PLATFORM_URL}
            BOT_DEFAULT_LANG=${BOT_DEFAULT_LANG:-uz}
            EOF
            docker compose -f docker-compose.bot.yml up -d --build --remove-orphans
            sleep 5
            docker compose -f docker-compose.bot.yml ps
            docker compose -f docker-compose.bot.yml logs --tail=30 bot
            echo "--- bot deploy tugadi ---"
