# ============================================================================
# AvtomaktabPlatforma — DB infratuzilmasi (Docker)
#
# MUHIM HAQIQAT: amaldagi backend SQLite (stdlib sqlite3) ishlatadi —
# mahalliy ishlab chiqishda Postgres/MySQL kerak EMAS. Shuning uchun Postgres
# servisi "db" PROFILI orqali ixtiyoriy (optional) qilib qo'yilgan:
#   docker compose --profile db up -d     # postgres'ni ishga tushirish
#   docker compose up -d                  # hech narsani qo'shmaydi (default)
#
# Postgres'dan foydalanmoqchi bo'lsangiz: scriptlar/sqlite_to_postgres.py
# yordamida ma'lumotlarni eksport qiling va server'ni psycopg2'li variantga
# o'tkazing (stdlib-only muhit uchun alohida field bilan berilgan).
#
# Hech bir parol YML ichiga qattiq yozilmagan — hammasi .env dan (qarang: .env.example)
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    profiles: ["db"]
    container_name: avtomaktab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avtomaktab}
      POSTGRES_USER: ${POSTGRES_USER:-avtomaktab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da ko'rsatilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avtomaktab} -d ${POSTGRES_DB:-avtomaktab}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - avtomaktab-net

  # ---- Telegram bot (aiogram 3) ----
  # .env da BOT_TOKEN va BOT_ADMINS bo'lishi shart (qarang: .env.example)
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: avtomaktab-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN .env da ko'rsatilishi shart}
      ADMIN_IDS: ${ADMIN_IDS:-}
      BOT_ADMINS: ${BOT_ADMINS:-}
      PLATFORM_NAME: ${PLATFORM_NAME:-Avtomaktab Platforma}
      PLATFORM_URL: ${PLATFORM_URL:-}
      BOT_DEFAULT_LANG: ${BOT_DEFAULT_LANG:-uz}
    volumes:
      - botdata:/app/data
    networks:
      - avtomaktab-net

networks:
  avtomaktab-net:
    driver: bridge

volumes:
  botdata:
    # Bot ma'lumotlar bazasi (bot.db) + avtomaktablar ro'yxati saqlanadi
  pgdata:
    # Named volume — container'ni o'chirsangiz ham ma'lumot saqlanib qoladi.
    # Zaxiralash (bayt-bayt nusxa):  docker run --rm -v avtomaktabplatforma_pgdata:/vol -v ${PWD}:/backup alpine tar czf /backup/pgdata-$(date +%F).tar.gz -C /vol .
    name: avtomaktabplatforma_pgdata
