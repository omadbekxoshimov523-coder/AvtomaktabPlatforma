# ============================================================================
# AvtomaktabPlatforma — CI + VEBSITE deploy (EC2 #1)
#
#   1. test  — unit/JS/i18n/bot sintaksis
#   2. build — Docker image qurish + smoke-test
#   3. deploy — faqat veb-saytni WEB_HOST ga joylashtiradi (Nginx orqali :80)
#
# Bot alohida EC2 da: .github/workflows/deploy-bot.yml
#
# GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   WEB_HOST           — sayt EC2 public IP/DNS
#   WEB_USER           — SSH user (ubuntu / ec2-user)
#   WEB_SSH_KEY        — private SSH kalit
#   WEB_APP_DIR        — serverdagi papka (masalan /opt/avtomaktab)
#   WEB_ADMIN_PASSWORD — birinchi admin paroli
#   YANDEX_MAPS_API_KEY, MAP_PROVIDER, MAP_CENTER_* (ixtiyoriy)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (deploy xatolari uchun, ixtiyoriy)
# ============================================================================
name: Test + Deploy Web (EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------- 1) TEST
  test:
    name: Testlar (unit + JS + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Birlik testlari
        run: python -m tests.test_api

      - name: JS sintaksis tekshiruvi
        run: python tools_js_check.py

      - name: i18n kalit tekshiruvi (informatsion)
        run: python tools_qa_i18n.py || echo "i18n ogohlantirishlar bor — bloklamaydi"

      - name: Bot sintaksis tekshiruvi
        run: python -m compileall -q bot

      - name: Workflow fayli tekshiruvi
        run: python tools_workflow_check.py

  # ------------------------------------------------------------- 2) BUILD
  build:
    name: Docker image qurish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Veb image qurish
        run: docker build -t autoprime-web:ci .

      - name: Bot image qurish
        run: docker build -f bot/Dockerfile -t avtomaktab-bot:ci .

      - name: Container sog'liq tekshiruvi (smoke)
        run: |
          docker run -d --name avtomaktab-smoke -p 18080:8080 \
            -e ADMIN_INITIAL_PASSWORD=ci-test-pw \
            -v avtomaktab-smoke-data:/app/data autoprime-web:ci
          sleep 6
          curl -fsS http://127.0.0.1:18080/api/health || { docker logs avtomaktab-smoke; exit 1; }
          docker rm -f avtomaktab-smoke
          docker volume rm avtomaktab-smoke-data

  # ------------------------------------------------------------- 3) WEB DEPLOY
  deploy:
    name: Veb-saytni EC2 ga joylashtirish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: WEB secret'lari bormi?
        id: gate
        env:
          WEB_HOST: ${{ secrets.WEB_HOST }}
          WEB_SSH_KEY: ${{ secrets.WEB_SSH_KEY }}
        run: |
          if [ -n "${WEB_HOST}" ] && [ -n "${WEB_SSH_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Web deploy o'tkazildi::WEB_HOST/WEB_SSH_KEY secret'lari qo'yilmagan."
          fi

      - name: SSH orqali veb-saytni joylashtirish
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_ADMIN_PASSWORD: ${{ secrets.WEB_ADMIN_PASSWORD }}
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
          MAP_PROVIDER: ${{ secrets.MAP_PROVIDER }}
          MAP_CENTER_LAT: ${{ secrets.MAP_CENTER_LAT }}
          MAP_CENTER_LNG: ${{ secrets.MAP_CENTER_LNG }}
          MAP_CENTER_ZOOM: ${{ secrets.MAP_CENTER_ZOOM }}
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ${{ secrets.WEB_USER }}
          key: ${{ secrets.WEB_SSH_KEY }}
          port: ${{ secrets.WEB_PORT || '22' }}
          envs: WEB_ADMIN_PASSWORD,YANDEX_MAPS_API_KEY,MAP_PROVIDER,MAP_CENTER_LAT,MAP_CENTER_LNG,MAP_CENTER_ZOOM
          script: |
            set -e
            APP_DIR="${{ secrets.WEB_APP_DIR }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            bash scripts/aws_bootstrap.sh web
            cat > .env <<EOF
            ADMIN_INITIAL_PASSWORD=${WEB_ADMIN_PASSWORD}
            YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY}
            MAP_PROVIDER=${MAP_PROVIDER:-yandex}
            MAP_CENTER_LAT=${MAP_CENTER_LAT:-41.311081}
            MAP_CENTER_LNG=${MAP_CENTER_LNG:-69.240562}
            MAP_CENTER_ZOOM=${MAP_CENTER_ZOOM:-12}
            EOF
            docker compose -f docker-compose.web.yml up -d --build --remove-orphans
            sudo cp deploy/nginx/autoprime.conf /etc/nginx/sites-available/autoprime.conf
            sudo ln -sf /etc/nginx/sites-available/autoprime.conf /etc/nginx/sites-enabled/autoprime.conf
            sudo nginx -t
            sudo systemctl reload nginx
            sleep 6
            curl -fsS http://127.0.0.1/api/health && echo ""
            docker compose -f docker-compose.web.yml ps
            echo "--- veb deploy tugadi ---"

  # ------------------------------------------------------------- 4) XABAR
  notify-failure:
    name: Muvaffaqiyatsizlik xabari
    needs: [test, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: GitHub xabari
        run: |
          echo "Workflow xato bilan tugadi."
          echo "Tafsilot: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram xabari uchun tayyorlik
        id: tg_gate
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${BOT}" ] && [ -n "${CHAT}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram xabari yuborish
        if: steps.tg_gate.outputs.ready == 'true'
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d "text=⚠️ *${REPO}* deploy xato bilan tugadi:%0Ahttps://github.com/${REPO}/actions/runs/${RUN}" \
            --data-urlencode parse_mode=Markdown || true
